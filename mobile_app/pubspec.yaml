name: newskit_app
description: "NewsKit - Premium Multi-Language News Portal & Hyperlocal Magazine Flutter Mobile App (Android & iOS)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & API
  http: ^1.2.1

  # Image Caching & Rendering
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10

  # UI & Animations
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  google_fonts: ^6.2.1

  # Article Content & Media
  flutter_html: ^3.0.0-beta.2
  youtube_player_flutter: ^9.0.1
  flutter_tts: ^4.0.2
  image_picker: ^1.1.0

  # Utilities & Storage
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

