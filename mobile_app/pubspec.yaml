name: newskit_app
description: "NewsKit - Premium Multi-Language News Portal & Hyperlocal Magazine Flutter Mobile App (Android & iOS)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & API
  http: ^1.2.1

  # Image Caching & Rendering
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10

  # UI & Animations
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  google_fonts: ^6.2.1

  # Article Content & Media
  flutter_widget_from_html: any
  youtube_player_flutter: any
  flutter_tts: any
  image_picker: any

  # Utilities & Storage
  shared_preferences: any
  share_plus: any
  url_launcher: any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

