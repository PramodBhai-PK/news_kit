name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Clean Android Platform
        run: |
          cd mobile_app
          rm -rf android
          flutter create . --org com.newskit --project-name newskit_app --platforms=android
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          content = open(p).read()
          content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application android:usesCleartextTraffic=\"true\"')
          open(p, 'w').write(content)
          "

      - name: Install Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: newskit-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 mobile_app/build/app/outputs/flutter-apk/app-release.apk \
            --title "NewsKit Mobile App v1.0.0 (Release APK)" \
            --notes "Direct download link for NewsKit Flutter Mobile App APK." \
            --clobber || true
