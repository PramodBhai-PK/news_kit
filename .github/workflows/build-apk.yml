name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Scaffold Clean Android Platform
        run: |
          cd mobile_app
          rm -rf android
          flutter create . --org com.newskit --project-name newskit_app --platforms=android
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          content = open(p).read()
          content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application android:usesCleartextTraffic=\"true\"')
          open(p, 'w').write(content)
          "

      - name: Install Dependencies & Patch Legacy Plugins
        run: |
          cd mobile_app
          flutter pub get
          python3 -c "
          import os
          for root, dirs, files in os.walk('/home/runner/.pub-cache'):
              for file in files:
                  if file.endswith('.gradle') or file.endswith('.gradle.kts'):
                      p = os.path.join(root, file)
                      try:
                          c = open(p, 'r', encoding='utf-8', errors='ignore').read()
                          nc = c
                          nc = nc.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
                          nc = nc.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
                          nc = nc.replace('flutter.compileSdkVersion', '34')
                          nc = nc.replace('flutter.minSdkVersion', '21')
                          nc = nc.replace('flutter.targetSdkVersion', '34')
                          nc = nc.replace('proguard-android.txt', 'proguard-android-optimize.txt')
                          if nc != c:
                              open(p, 'w', encoding='utf-8').write(nc)
                      except Exception:
                          pass
          "

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: newskit-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "NewsKit Mobile App v1.0.0 (Release APK)"
          body: "Official Android Release APK for NewsKit Mobile App."
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
